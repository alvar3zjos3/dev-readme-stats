
      <svg
        width="495"
        height="165"
        viewBox="0 0 495 165"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #ffffff;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #ffffff;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .not_bold { font-weight: 400 }
    .bold { font-weight: 700 }
  
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        
        <defs>
          <linearGradient
            id="gradient"
            gradientTransform="rotate(35)"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#4158d0" />,<stop offset="50%" stop-color="#c850c0" />,<stop offset="100%" stop-color="#ffcc70" />
          </linearGradient>
        </defs>
        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="494"
          fill="url(#gradient)"
          stroke-opacity="1"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Estad&#237;sticas de WakaTime</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg x="0" y="0" width="100%">
      
      <mask id="rect-mask">
      <rect x="25" y="0" width="440" height="8" fill="white" rx="5" />
      </mask>
      
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="0"
            y="0"
            width="209.622"
            height="8"
            fill="#083fa1"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="209.622"
            y="0"
            width="176.3745"
            height="8"
            fill="#f1e05a"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="385.9965"
            y="0"
            width="68.634"
            height="8"
            fill="#cb171e"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="454.63050000000004"
            y="0"
            width="6.463499999999999"
            height="8"
            fill="#858585"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="461.09400000000005"
            y="0"
            width="3.2084999999999995"
            height="8"
            fill="#292929"
          />
        
      
    <g transform="translate(25, 25)">
      <circle cx="5" cy="6" r="5" fill="#083fa1" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Markdown - 5 hrs 34 mins
      </text>
    </g>
  
    <g transform="translate(230, 25)">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        JavaScript - 4 hrs 41 mins
      </text>
    </g>
  
    <g transform="translate(25, 50)">
      <circle cx="5" cy="6" r="5" fill="#cb171e" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        YAML - 1 hr 49 mins
      </text>
    </g>
  
    <g transform="translate(230, 50)">
      <circle cx="5" cy="6" r="5" fill="#858585" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Other - 10 mins
      </text>
    </g>
  
    <g transform="translate(25, 75)">
      <circle cx="5" cy="6" r="5" fill="#292929" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        JSON - 5 mins
      </text>
    </g>
  
    
    </svg>
  
        </g>
      </svg>
    