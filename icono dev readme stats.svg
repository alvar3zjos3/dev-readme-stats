<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients that match the default theme (dark background with vibrant accents) -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#24292e"/>
    </linearGradient>

    <linearGradient id="primary-accent" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79ff97"/>
      <stop offset="1" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Drop shadow for the main elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#79ff97" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base container (rounded square resembling a GitHub App or Repository icon) -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e4e2e2" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- README aspect: Document / File shape background -->
  <path d="M16 12C14.8954 12 14 12.8954 14 14V50C14 51.1046 14.8954 52 16 52H48C49.1046 52 50 51.1046 50 50V22L40 12H16Z" fill="#30363d" opacity="0.6"/>
  <path d="M40 12V22H50" fill="#4b5563" opacity="0.6"/>

  <!-- DEV aspect: Code Brackets -->
  <path d="M22 28L16 34L22 40" stroke="#9f9f9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 28L48 34L42 40" stroke="#9f9f9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STATS aspect: Rising Bar Chart in the middle -->
  <rect x="25" y="36" width="3.5" height="5" rx="1" fill="url(#primary-accent)" filter="url(#glow)"/>
  <rect x="30.5" y="30" width="3.5" height="11" rx="1" fill="url(#primary-accent)" filter="url(#glow)"/>
  <rect x="36" y="24" width="3.5" height="17" rx="1" fill="url(#primary-accent)" filter="url(#glow)"/>

</svg>
