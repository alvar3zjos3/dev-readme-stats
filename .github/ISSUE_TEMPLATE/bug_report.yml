name: Reporte de error
description: Crea un informe para ayudarnos a mejorar.
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        :warning: LEE PRIMERO LAS PREGUNTAS FRECUENTES [(#1770)](https://github.com/alvar3zjos3/dev-readme-stats/discussions/1770) Y LOS CÓDIGOS DE ERROR COMUNES [(#1772)](https://github.com/alvar3zjos3/dev-readme-stats/issues/1772).
  - type: textarea
    attributes:
      label: Describe el error
      description: Una descripción clara y concisa del problema.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Comportamiento esperado
      description:
        Una descripción clara y concisa de lo que esperabas que ocurriera.
  - type: textarea
    attributes:
      label: Capturas / enlace de demostración
      description: Si aplica, añade capturas para explicar el problema.
      placeholder: Pega el enlace de dev-readme-stats como imagen markdown
  - type: textarea
    attributes:
      label: Contexto adicional
      description: Cualquier otro contexto relevante sobre el problema.
  - type: markdown
    attributes:
      value: |
        ---
        ### Preguntas frecuentes (extracto)

        Algunas preguntas habituales del FAQ. La versión completa está en [#1770](https://github.com/alvar3zjos3/dev-readme-stats/discussions/1770).

        #### P: Mi tarjeta muestra un error

        **R:** Revisa primero los [códigos de error comunes](https://github.com/alvar3zjos3/dev-readme-stats/issues/1772) y los issues existentes antes de abrir uno nuevo.

        #### P: ¿Cómo ocultar Jupyter Notebook?

        **R:** `&hide=jupyter%20notebook`.

        #### P: No logré desplegar mi propia instancia en Vercel

        **R:** Consulta la documentación:
          - [Auto-alojamiento en Vercel](https://github.com/alvar3zjos3/dev-readme-stats#auto-alojado-vercelotro)

        #### P: ¿Cómo contar estadísticas privadas?

        **R:** Solo podemos contar commits privados y no tenemos acceso a otra información privada de los usuarios. La única forma es desplegar tu propia instancia y usar tu propio PAT (Personal Access Token).
