    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: stats
        uses: alvar3zjos3/dev-readme-stats-action@30da8488fafde3eebf4d6232285d6d0ea992cdcd
        with:
          card: stats
          options:
            username=${{ github.repository_owner }}&theme=${{ matrix.theme }}
          path: profile/themes/${{ matrix.theme }}/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: top-langs
        uses: alvar3zjos3/dev-readme-stats-action@30da8488fafde3eebf4d6232285d6d0ea992cdcd
        with:
