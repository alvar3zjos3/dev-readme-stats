          path: profile/themes/${{ matrix.theme }}/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.theme }}
          path: profile/themes/${{ matrix.theme }}/

