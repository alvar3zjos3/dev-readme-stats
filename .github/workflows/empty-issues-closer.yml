name: Cerrar issues vacíos y plantillas
on:
  issues:
    types:
      - reopened
      - opened
      - edited

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  issues: write
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  closeEmptyIssuesAndTemplates:
    if: github.repository == 'alvar3zjos3/dev-readme-stats'
    name: Cerrar issues vacíos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Ejecutar acción de cierre de issues vacíos
        uses: rickstaa/empty-issues-closer-action@e96914613221511279ca25f50fd4acc85e331d99 # v1.1.74
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        with:
          close_comment:
            Cerrando este issue porque parece estar vacío. Actualízalo para que
            pueda reabrirse.
          open_comment:
            Reabriendo este issue porque el autor proporcionó más información.
          check_templates: true
          template_close_comment:
            Cerrando este issue porque no se completó la plantilla. Proporciona
            más información para que pueda reabrirse.
          template_open_comment:
            Reabriendo este issue porque el autor proporcionó más información.
