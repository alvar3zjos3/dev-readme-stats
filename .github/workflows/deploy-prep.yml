name: Preparación de despliegue
on:
  workflow_dispatch:
  push:
    branches:
      - master
permissions:
  contents: read

jobs:
  config:
    if: github.repository == 'alvar3zjos3/dev-readme-stats'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparación de despliegue
        run: python ./.github/workflows/deploy-prep.py
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: vercel
          create_branch: true
          push_options: "--force"
